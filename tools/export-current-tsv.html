<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HaseLab TSV Exporter</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; line-height: 1.7; }
    button { margin: 8px 8px 8px 0; padding: 10px 16px; }
    pre { background: #f5f5f5; padding: 16px; white-space: pre-wrap; }
    .ok { color: #176b2c; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>現行HTML → TSV移行ツール</h1>
  <p>
    このファイルを <code>tools/export-current-tsv.html</code> として現行サイトに置き、
    HTMLをTSV版へ置き換える前に一度だけ実行してください。
  </p>
  <button id="news">news.tsv を作成</button>
  <button id="pubs">publications.tsv を作成</button>
  <button id="both">両方作成</button>
  <pre id="status">準備完了</pre>

<script>
(function () {
  'use strict';

  const status = document.getElementById('status');

  function clean(value) {
    return String(value ?? '')
      .replace(/\t/g, ' ')
      .replace(/\r?\n/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function tsvRow(values) {
    return values.map(clean).join('\t');
  }

  function download(filename, text) {
    const blob = new Blob(['\uFEFF' + text], { type: 'text/tab-separated-values;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  async function fetchDocument(path) {
    const response = await fetch(path, { cache: 'no-cache' });
    if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
    const html = await response.text();
    return new DOMParser().parseFromString(html, 'text/html');
  }

  function normalizeNewsDate(value) {
    const digits = clean(value).replace(/\D/g, '');
    // 現行ページで確認された 202606010 は 20260610 として補正。
    if (digits === '202606010') return '20260610';
    return digits;
  }

  async function exportNews() {
    const doc = await fetchDocument('../index_iframe.html');
    const entries = [];

    for (const p of doc.querySelectorAll('p.glyphicon')) {
      const raw = clean(p.textContent);
      const match = raw.match(/^\[([^\]]+)\]\s+(\d{8,9})\s+(.+)$/);
      if (!match) continue;

      const category = clean(match[1]);
      const date = normalizeNewsDate(match[2]);
      const message = clean(match[3]);
      const link = p.querySelector('a[href]');
      const url = link ? clean(link.getAttribute('href')) : '';
      const details = [];

      let sibling = p.nextElementSibling;
      while (sibling && !(sibling.matches && sibling.matches('p.glyphicon'))) {
        if (sibling.tagName === 'UL') {
          sibling.querySelectorAll(':scope > li').forEach(li => details.push(clean(li.textContent)));
        }
        sibling = sibling.nextElementSibling;
      }

      entries.push({ date, category, message, url, details: details.join(' || ') });
    }

    const lines = [tsvRow(['date', 'category', 'message', 'url', 'details'])];
    entries.forEach(item => lines.push(tsvRow([item.date, item.category, item.message, item.url, item.details])));
    download('news.tsv', lines.join('\n') + '\n');
    return entries.length;
  }

  async function exportPublications() {
    const doc = await fetchDocument('../publication.html');
    const entries = [];

    for (const h3 of doc.querySelectorAll('h3')) {
      const section = clean(h3.textContent);
      let ol = h3.nextElementSibling;
      while (ol && ol.tagName !== 'OL') ol = ol.nextElementSibling;
      if (!ol) continue;

      let order = 1;
      for (const li of Array.from(ol.children).filter(el => el.tagName === 'LI')) {
        const text = clean(li.textContent);
        const link = li.querySelector('a[href]');
        const url = link ? clean(link.getAttribute('href')) : '';
        if (!text) continue;
        entries.push({ section, order, text, url });
        order += 1;
      }
    }

    const lines = [tsvRow(['section', 'order', 'text', 'url'])];
    entries.forEach(item => lines.push(tsvRow([item.section, item.order, item.text, item.url])));
    download('publications.tsv', lines.join('\n') + '\n');
    return entries.length;
  }

  async function run(which) {
    try {
      status.className = '';
      status.textContent = '変換中...';
      const messages = [];
      if (which === 'news' || which === 'both') {
        messages.push(`news.tsv: ${await exportNews()}件`);
      }
      if (which === 'pubs' || which === 'both') {
        messages.push(`publications.tsv: ${await exportPublications()}件`);
      }
      status.className = 'ok';
      status.textContent = messages.join('\n') + '\n完了しました。ダウンロードされたTSVを data/ に配置してください。';
    } catch (error) {
      console.error(error);
      status.className = 'error';
      status.textContent = `失敗: ${error.message}`;
    }
  }

  document.getElementById('news').addEventListener('click', () => run('news'));
  document.getElementById('pubs').addEventListener('click', () => run('pubs'));
  document.getElementById('both').addEventListener('click', () => run('both'));
})();
</script>
</body>
</html>
