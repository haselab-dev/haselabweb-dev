<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>Member TSV Exporter</title>
</head>

<body>

<h1>Member TSV Exporter</h1>

<p>
    現在の member.html を解析して
    members.tsv を生成します。
</p>

<button id="export-button">
    members.tsv を作成
</button>

<pre id="status"></pre>

<script>
(function () {
    'use strict';

    function cleanText(value) {
        return (value || '')
            .replace(/\t/g, ' ')
            .replace(/\r?\n/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
    }


    function getText(element) {
        return element
            ? cleanText(element.textContent)
            : '';
    }


    function removePrefix(text, prefix) {
        if (text.startsWith(prefix)) {
            return text.substring(prefix.length).trim();
        }

        return text;
    }


    function findCardRow(headingRow) {

        let element =
            headingRow.nextElementSibling;

        while (element) {

            if (
                element.classList.contains('row') &&
                element.classList.contains('row-space-1')
            ) {
                return element;
            }

            element =
                element.nextElementSibling;
        }

        return null;
    }


    function extractMembers(documentObject) {

        const container =
            documentObject.querySelector(
                '.bg-color-sky-light .content-lg.container'
            );

        if (!container) {
            throw new Error(
                'Member container が見つかりません。'
            );
        }


        const result = [];

        const headings =
            container.querySelectorAll('h2');


        headings.forEach(function (h2) {

            const section =
                getText(h2);

            const headingRow =
                h2.closest('.row');

            if (!headingRow) {
                return;
            }


            const cardRow =
                findCardRow(headingRow);

            if (!cardRow) {
                return;
            }


            let order = 1;


            Array.from(cardRow.children)
                .filter(function (child) {

                    return child.classList.contains(
                        'col-sm-4'
                    );

                })
                .forEach(function (column) {

                    const service =
                        column.querySelector(
                            '.service'
                        );

                    if (!service) {
                        return;
                    }


                    const catchphrase =
                        getText(
                            service.querySelector(
                                '.service-element .margin-b-0'
                            )
                        );


                    const info =
                        service.querySelector(
                            '.service-info'
                        );

                    if (!info) {
                        return;
                    }


                    const name =
                        getText(
                            info.querySelector('h3')
                        );


                    if (!name) {
                        return;
                    }


                    const note =
                        getText(
                            info.querySelector(
                                'p.margin-b-2'
                            )
                        );


                    let theme = '';
                    let hometown = '';
                    let comment = '';


                    info
                        .querySelectorAll(
                            'p.margin-b-5'
                        )
                        .forEach(function (p) {

                            const text =
                                getText(p);

                            if (
                                text.startsWith(
                                    '研究テーマ：'
                                )
                            ) {
                                theme =
                                    removePrefix(
                                        text,
                                        '研究テーマ：'
                                    );

                            } else if (
                                text.startsWith(
                                    '出身：'
                                )
                            ) {
                                hometown =
                                    removePrefix(
                                        text,
                                        '出身：'
                                    );

                            } else if (
                                text.startsWith(
                                    '一言：'
                                )
                            ) {
                                comment =
                                    removePrefix(
                                        text,
                                        '一言：'
                                    );
                            }

                        });


                    const link =
                        service.querySelector(
                            'a.content-wrapper-link[href]'
                        );


                    const url =
                        link
                            ? link.getAttribute('href')
                            : '';


                    result.push({
                        section: section,
                        order: order,
                        name: name,
                        catchphrase: catchphrase,
                        note: note,
                        theme: theme,
                        hometown: hometown,
                        comment: comment,
                        url: url
                    });


                    order++;
                });

        });


        return result;
    }


    function toTsv(rows) {

        const headers = [
            'section',
            'order',
            'name',
            'catchphrase',
            'note',
            'theme',
            'hometown',
            'comment',
            'url'
        ];


        const lines = [
            headers.join('\t')
        ];


        rows.forEach(function (row) {

            const values =
                headers.map(function (header) {

                    return cleanText(
                        String(
                            row[header] ?? ''
                        )
                    );

                });


            lines.push(
                values.join('\t')
            );

        });


        return lines.join('\n');
    }


    function downloadFile(
        filename,
        content
    ) {

        const blob =
            new Blob(
                [
                    '\uFEFF' + content
                ],
                {
                    type:
                        'text/tab-separated-values;charset=utf-8'
                }
            );


        const url =
            URL.createObjectURL(blob);


        const a =
            document.createElement('a');

        a.href = url;
        a.download = filename;

        document.body.appendChild(a);

        a.click();

        a.remove();

        URL.revokeObjectURL(url);
    }


    async function exportMembers() {

        const status =
            document.getElementById(
                'status'
            );

        status.textContent =
            'member.html を読み込んでいます...';


        try {

            const response =
                await fetch(
                    '../member.html',
                    {
                        cache: 'no-store'
                    }
                );


            if (!response.ok) {
                throw new Error(
                    'member.html の取得に失敗しました。'
                );
            }


            const html =
                await response.text();


            const parser =
                new DOMParser();


            const documentObject =
                parser.parseFromString(
                    html,
                    'text/html'
                );


            const members =
                extractMembers(
                    documentObject
                );


            if (
                members.length === 0
            ) {
                throw new Error(
                    'Memberが1件も取得できませんでした。'
                );
            }


            const tsv =
                toTsv(members);


            downloadFile(
                'members.tsv',
                tsv
            );


            status.textContent =
                members.length +
                '名を members.tsv に出力しました。';


        } catch (error) {

            console.error(error);

            status.textContent =
                'エラー: ' +
                error.message;
        }
    }


    document
        .getElementById(
            'export-button'
        )
        .addEventListener(
            'click',
            exportMembers
        );

})();
</script>

</body>
</html>
